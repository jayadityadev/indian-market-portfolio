[project]
name = "indian-market-intelligence"
version = "0.1.0"
description = "ML-augmented backtesting and regime detection dashboard for Indian equities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "joblib>=1.5.0",
    "numpy>=2.4.4",
    "openai>=2.36.0",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "streamlit>=1.57.0",
    "uvicorn>=0.46.0",
    "yfinance>=1.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "app", "backtester", "data_pipeline", "regime_detector", "strategies", "utils",
    "classifier_features", "classifier_inference", "label_generator", "train_classifier",
    "risk_forecaster",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
