[project]
name = "indian-market-intelligence"
version = "0.1.0"
description = "ML-augmented backtesting and regime detection dashboard for Indian equities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "google-genai>=0.1.1",
    "hmmlearn>=0.3.2",
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "openai>=1.30.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "psycopg2-binary>=2.9.9",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "sqlalchemy>=2.0.30",
    "streamlit>=1.35.0",
    "torch>=2.2.0",
    "uvicorn>=0.30.0",
    "xgboost>=2.0.0",
    "yfinance>=0.2.38",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "app", "backtester", "data_pipeline", "regime_detector", "strategies", "utils",
    "classifier_features", "classifier_inference", "label_generator", "train_classifier",
    "risk_forecaster", "market_outlook",
]
packages = ["models", "api", "api.routes", "db", "llm"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
